<!doctype html>
<html>
  <head>
    <title>REGMABA UNSRAT - Verifikasi Ijazah</title>

    {% load static %}

    <link rel="icon" href="{% static 'images/logo-unsrat2.png' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6" />
  </head>

  <body>
    <!-- NAVIGASI -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-left">
          <img src="{% static 'images/logo-unsrat2.png' %}" class="logo" />
          <div class="nav-text">
            <h2>REGMABA UNSRAT - Verifikasi Ijazah</h2>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-wrapper">
      <main class="main-content">
        <!-- BAGIAN ATAS -->
        <div class="page-header">
          <h1>Dashboard Verifikasi</h1>
          <p>Unggah ijazah untuk proses verifikasi oleh admin</p>
        </div>

        <div class="content-grid">
          <!-- ================= UNGGAH ================= -->
          <div class="card upload-card">
            <div class="card-header">
              <h3>Unggah Berkas</h3>
            </div>

            <div class="card-body">
              <!-- FORMULIR -->
              <form
                id="verification-form"
                method="POST"
                enctype="multipart/form-data"
              >
                {% csrf_token %}

                <!-- INPUT BERKAS -->
                <div class="file-input-wrapper">
                  <input
                    id="ijazah-file"
                    type="file"
                    name="ijazah"
                    multiple
                    required
                    class="file-input"
                  />

                  <label for="ijazah-file" class="file-input-label">
                    <span class="file-input-icon">📄</span>
                    <span>Klik untuk pilih satu / banyak file</span>
                  </label>
                </div>

                <div
                  id="selected-file-preview"
                  class="uploaded-file-box selected-file-preview"
                  style="display: none"
                >
                  <p class="uploaded-title">File yang dipilih</p>
                  <div id="file-list"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                  Unggah & Verifikasi
                </button>
              </form>
            </div>
          </div>

          <!-- ================= HASIL ================= -->
          <div class="card upload-card">
            <div class="card-header">
              <h3>Hasil Unggah</h3>
            </div>

            <div class="card-body">
              <div id="upload-progress" style="display: none; margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                  <span id="progress-text" style="font-size: 14px; color: var(--color-text-light);">Memproses...</span>
                  <span id="progress-count" style="font-size: 14px; font-weight: 600; color: var(--color-primary);"></span>
                </div>
                <div style="width: 100%; height: 8px; background: #e0e6ed; border-radius: 4px; overflow: hidden;">
                  <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); border-radius: 4px; transition: width 0.4s ease;"></div>
                </div>
              </div>

              <div id="results-container" class="uploaded-file-box" style="display: none;"></div>

              <div id="empty-message" class="verification-box default">
                <p>Belum ada dokumen yang diunggah.</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <!-- SCRIPT -->
    <script src="{% static 'js/index.js' %}?v=2"></script>
  </body>
</html>
